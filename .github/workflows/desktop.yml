name: desktop

# Lightagent Desktop gates (docs/desktop/). Each slice adds its jobs here;
# everything runs on GitHub-hosted runners and checks out the exact PR head,
# so the evidence names the commit under review.
#   D0  inventory: the capability inventory matches the source.
#   D2  contract, host and shell: the operation contract matches the server
#       and the UI client; the desktop host builds, lints and tests; the
#       packaged shell starts its runtime and renders on every target.
#   D3  the shell bundles the real runtime (`lightagent serve --desktop`),
#       which must exit when the host goes away; the mock remains only to
#       prove a version mismatch is refused.
#   D3b crash detection and one restart, and the single-instance policy.

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'frontend/**'
      - 'desktop/**'
      - 'docs/desktop/**'
      - 'scripts/check-desktop-*.py'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  TAURI_CLI: '@tauri-apps/cli@2.12.3'

jobs:
  inventory:
    name: desktop capability inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record the tested commit
        run: |
          {
            echo "### Tested commit"
            echo "- head: \`$(git rev-parse HEAD)\`"
            echo "- tree: \`$(git rev-parse 'HEAD^{tree}')\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The drift check detects additions (self-test)
        run: python3 -I scripts/check-desktop-inventory.py --self-test
      - name: The inventory matches the source
        if: success() || failure()
        run: python3 -I scripts/check-desktop-inventory.py
      - name: The contract check detects drift (self-test)
        if: success() || failure()
        run: python3 -I scripts/check-desktop-contract.py --self-test
      - name: The operation contract matches the server and the UI client
        if: success() || failure()
        run: python3 -I scripts/check-desktop-contract.py
      - run: rustup show
        if: success() || failure()
      - uses: Swatinem/rust-cache@v2
        if: success() || failure()
        with:
          key: desktop-inventory
      - name: The CLI tree matches clap
        if: success() || failure()
        run: cargo test -p lightagent --lib --locked desktop_inventory

  host:
    name: desktop host (fmt, clippy, tests, dependency policy)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Linux system packages (webview)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: desktop-host
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend (both builds)
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          npm run build:desktop --prefix frontend
      - name: Stage the runtime and icons the host build expects
        run: |
          locked=$([ -f desktop/Cargo.lock ] && echo --locked || true)
          cargo build $locked --manifest-path desktop/Cargo.toml -p lightagent-mock-sidecar
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p desktop/src-tauri/binaries
          cp desktop/target/debug/lightagent-mock-sidecar "desktop/src-tauri/binaries/lightagent-sidecar-$triple"
          (cd desktop && npx --yes "$TAURI_CLI" icon ../icon/LightagentLogo.png -o src-tauri/icons)
      - name: Desktop and runtime versions agree
        run: |
          root=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | sed -n 's/^version *= *"\([^"]*\)".*/\1/p' | head -1)
          desk=$(sed -n '/^\[workspace\.package\]/,/^\[/p' desktop/Cargo.toml | sed -n 's/^version *= *"\([^"]*\)".*/\1/p' | head -1)
          conf=$(python3 -c "import json; print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          echo "runtime $root, desktop $desk, bundle $conf"
          [ "$root" = "$desk" ] && [ "$desk" = "$conf" ] || { echo "::error::desktop and runtime versions disagree"; exit 1; }
      - name: Format
        run: cargo fmt --manifest-path desktop/Cargo.toml --all --check
      - name: Clippy
        run: |
          locked=$([ -f desktop/Cargo.lock ] && echo --locked || true)
          cargo clippy $locked --manifest-path desktop/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Tests
        run: |
          locked=$([ -f desktop/Cargo.lock ] && echo --locked || true)
          cargo test $locked --manifest-path desktop/Cargo.toml --workspace
      - name: Dependency policy (the repository's banned crates, all targets)
        run: |
          status=0
          for crate in aws-lc-sys aws-lc-rs openssl-sys native-tls bindgen cmake; do
            if cargo tree --manifest-path desktop/Cargo.toml --workspace --target all -e normal,build -i "$crate" >/dev/null 2>&1; then
              echo "::error::POLICY: \`$crate\` is in the desktop dependency graph"; status=1
            fi
          done
          [ -f desktop/Cargo.lock ] && git diff --exit-code -- desktop/Cargo.lock \
            || echo "::warning::desktop/Cargo.lock is not committed yet; the generated one is uploaded"
          echo "- desktop dependency policy: $([ $status = 0 ] && echo clean || echo VIOLATED); crates: $(grep -c '^name = ' desktop/Cargo.lock)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-cargo-lock
          retention-days: 30
          path: desktop/Cargo.lock

  shell:
    name: desktop shell (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, label: macos-x64, arch: x86_64, macos_min: '10.14', bundles: 'app,dmg' }
          - { os: macos-15, label: macos-arm64, arch: arm64, macos_min: '11.0', bundles: 'app,dmg' }
          - { os: windows-latest, label: windows-x64, arch: x86_64, bundles: 'nsis,msi' }
          - { os: ubuntu-22.04, label: linux-x64, arch: x86_64, bundles: 'deb,appimage' }
    defaults:
      run:
        shell: bash
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Runner identity and tested commit
        env:
          WANT_ARCH: ${{ matrix.arch }}
        run: |
          arch=$(uname -m); case "$arch" in x86_64|amd64|AMD64) arch=x86_64;; aarch64|arm64) arch=arm64;; esac
          {
            echo "### desktop shell ${{ matrix.label }}"
            echo "- image: ${ImageOS:-unknown} ${ImageVersion:-}"
            echo "- head: \`$(git rev-parse HEAD)\` tree \`$(git rev-parse 'HEAD^{tree}')\`"
            [ "$(uname -s)" = Darwin ] && echo "- macOS $(sw_vers -productVersion), translated: $(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)"
            true
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$arch" = "$WANT_ARCH" ] || { echo "runner is $arch, expected $WANT_ARCH" >&2; exit 1; }
      - name: macOS deployment target
        if: matrix.macos_min
        run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_min }}" >> "$GITHUB_ENV"
      - name: Linux system packages (webview, display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file xvfb imagemagick
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop -> target
          key: desktop-shell-${{ matrix.label }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install psutil==7.1.0 pillow==11.3.0
      - name: Desktop frontend
        run: |
          npm ci --prefix frontend
          npm run build:desktop --prefix frontend
      - name: Stage the runtime (the real lightagent) and icons
        run: |
          cargo build --locked --release -p lightagent
          cargo build --locked --release --manifest-path desktop/Cargo.toml -p lightagent-mock-sidecar
          triple=$(rustc -vV | sed -n 's/^host: //p'); ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          mkdir -p desktop/src-tauri/binaries
          cp "target/release/lightagent$ext" "desktop/src-tauri/binaries/lightagent-sidecar-$triple$ext"
          (cd desktop && npx --yes "$TAURI_CLI" icon ../icon/LightagentLogo.png -o src-tauri/icons)
      - name: Build and bundle
        working-directory: desktop
        run: |
          config='{}'
          [ -n "${{ matrix.macos_min }}" ] && config="{\"bundle\":{\"macOS\":{\"minimumSystemVersion\":\"${{ matrix.macos_min }}\"}}}"
          start=$(date +%s)
          # hdiutil on hosted macOS images intermittently fails with "Resource
          # busy" (D3b run 41003067980). Only that exact failure is retried,
          # at most three attempts; every attempt's log is kept as an artifact
          # and each retry is reported. Any other failure fails at once.
          mkdir -p "$RUNNER_TEMP/desktop-e2e"
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/desktop-e2e/bundle-attempt-$attempt.log"
            if npx --yes "$TAURI_CLI" build --ci --bundles ${{ matrix.bundles }} --config "$config" 2>&1 | tee "$log"; then
              break
            fi
            if ! grep -q 'hdiutil: create failed - Resource busy' "$log" || [ "$attempt" = 3 ]; then
              exit 1
            fi
            echo "- bundling attempt $attempt hit hdiutil 'Resource busy'; retrying (log kept)" | tee -a "$GITHUB_STEP_SUMMARY"
            sleep 20
          done
          echo "- build+bundle: $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Package facts
        working-directory: desktop/target/release
        run: |
          {
            if [ "$(uname -s)" = Darwin ]; then
              app=$(ls -d bundle/macos/*.app)
              for bin in "$app/Contents/MacOS/"*; do
                echo "- $(basename "$bin"): $(lipo -archs "$bin"), $(otool -l "$bin" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print "minos "$2; exit}')"
              done
              echo "- LSMinimumSystemVersion: $(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")"
            fi
            find bundle -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -print0 \
              | while IFS= read -r -d '' f; do python -c "import os,sys; print('- %s: %.1f MB' % (os.path.basename(sys.argv[1]), os.path.getsize(sys.argv[1])/1048576))" "$f"; done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: End-to-end (runner, ready and mismatch)
        run: |
          out="$RUNNER_TEMP/desktop-e2e"
          r=desktop/target/release
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          case "$(uname -s)" in
            Darwin) dir="$(ls -d $r/bundle/macos/*.app)/Contents/MacOS"; wrap=() ;;
            # A session bus, as every Linux desktop has: without one GTK waits
            # about 30 s at start-up (D3a evidence), measured separately below.
            Linux) dir="$r"; wrap=(xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session --) ;;
            *) dir="$r"; wrap=() ;;
          esac
          app=("$dir/lightagent-desktop$ext")
          # An isolated home: the bundled runtime scaffolds it on first start.
          export LIGHTAGENT_HOME="$RUNNER_TEMP/lightagent-home"
          status=0
          export E2E_REQUIRE_NO_ORPHAN=1
          for mode in ready crash duplicate; do
            "${wrap[@]}" python desktop/e2e/run.py "$out" "$mode" -- "${app[@]}" || status=1
          done
          if [ "$RUNNER_OS" = Linux ]; then
            # Residual risk: a Linux session without a D-Bus session bus (recorded, not gated).
            xvfb-run -a -s '-screen 0 1280x800x24' python desktop/e2e/run.py "$out/no-session-bus" ready -- "${app[@]}" || true
          fi
          # Version mismatch: swap in the mock runtime, which can report another version.
          cp "$dir/lightagent-sidecar$ext" "$RUNNER_TEMP/real-sidecar$ext"
          cp "desktop/target/release/lightagent-mock-sidecar$ext" "$dir/lightagent-sidecar$ext"
          LIGHTAGENT_MOCK_REPORT_VERSION=0.0.0-mismatch "${wrap[@]}" python desktop/e2e/run.py "$out" mismatch -- "${app[@]}" || status=1
          cp "$RUNNER_TEMP/real-sidecar$ext" "$dir/lightagent-sidecar$ext"
          python - "$out" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json, os, sys
          for path in sorted(glob.glob(os.path.join(sys.argv[1], "**", "e2e-*.json"), recursive=True)):
              d = json.load(open(path))
              label = os.path.relpath(path, sys.argv[1])
              print(f"- {label}: milestones {d['milestones_s']}, missing {d['missing']}, key leaks {d['key_leaks'] or 'none'}, runtime survived host termination: {d['runtime_survived_host_termination']}")
          PY
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-shell-${{ matrix.label }}
          retention-days: 30
          path: |
            ${{ runner.temp }}/desktop-e2e/
            desktop/target/release/bundle/**/*.dmg
            desktop/target/release/bundle/**/*.msi
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/**/*.deb
            desktop/target/release/bundle/**/*.AppImage
