name: jev evaluation

# The deterministic Jev evaluation suite: the labeled synthetic dataset run
# through the production classifier against scripted answers, the
# legacy_raw-versus-sanitized routing comparison, the privacy regression and
# the preflight performance simulation. No credential is used and nothing
# leaves the runner. Its numbers test the pipeline; they are not Jev accuracy.
# Live measurements come only from the manually dispatched jev-live workflow.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: jev-evaluation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'

jobs:
  evaluate:
    name: Jev deterministic evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: jev-evaluation
      - name: Run the evaluation, adversarial and performance suites
        env:
          LIGHTAGENT_JEV_EVAL_OUT: ${{ runner.temp }}/jev-evaluation
        run: |
          set -euo pipefail
          cargo test -p lightagent --lib -- coordinator:: serve::routing_tests:: chat::model_tests::terminal_
          for report in classification-mock confusion-matrix-mock threshold-analysis-mock \
                        routing-mock privacy-regression performance-simulation; do
            test -s "$LIGHTAGENT_JEV_EVAL_OUT/$report.json" || { echo "missing $report.json"; exit 1; }
          done
      - name: Build the blinded label-review package
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/jev-label-review"
          python3 -I scripts/jev-review-package.py evaluation/jev/benchmark.v1.json "$out"
          for file in blind-worksheet.csv author-labels.csv review-key.csv manifest.json; do
            test -s "$out/$file" || { echo "missing $file"; exit 1; }
          done
          # The worksheet must not reveal case ids: their prefixes name categories.
          if grep -Eq '\b(conv|res|code|ana|auto|ms|amb|ret|none|unav|priv|bad)-[0-9]{3}\b' "$out/blind-worksheet.csv"; then
            echo "the blind worksheet exposes a case id"; exit 1
          fi
          test "$(($(wc -l < "$out/review-key.csv") - 1))" -eq 101
      - uses: actions/upload-artifact@v7
        with:
          name: jev-label-review-package
          path: ${{ runner.temp }}/jev-label-review/
          if-no-files-found: error
      - name: Summarize
        if: always()
        env:
          LIGHTAGENT_JEV_EVAL_OUT: ${{ runner.temp }}/jev-evaluation
        run: |
          for summary in "$LIGHTAGENT_JEV_EVAL_OUT"/*.md; do
            [ -f "$summary" ] && { cat "$summary"; echo; } >> "$GITHUB_STEP_SUMMARY"
          done
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jev-evaluation-reports
          path: ${{ runner.temp }}/jev-evaluation/
          if-no-files-found: warn
