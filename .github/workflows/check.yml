name: research-history analyzer validation (throwaway, never merged)

# Throwaway validation branch tests/v060-research-history only. This file
# replaces check.yml on that branch so the analyzer can be validated by a
# dispatch of an existing workflow; it is never merged and touches no other
# branch. GitHub-hosted runners only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-sessions:
    name: real conversations saved by the Lightagent binary
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: dlroqa/Lightweight
          ref: c380bddafedb27adc7044a5482bb91ddf04e4e33
          path: lightweight-provider
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: paired-lightweight-e2e
          save-if: false
      - name: Build the independent Lightweight test provider
        run: cargo build -p lightweight-gateway --features mock --bin hermes-mock-gateway
        working-directory: lightweight-provider
      - name: Build the Lightagent harness
        run: cargo build -p lightagent --bin lightagent
      - name: Save the conversations of the research scenarios
        env:
          LIGHTWEIGHT_MOCK_GATEWAY: ${{ github.workspace }}/lightweight-provider/target/debug/hermes-mock-gateway
          LIGHTAGENT_BIN: ${{ github.workspace }}/target/debug/lightagent
        run: python3 tests/research-history/real_sessions.py "$RUNNER_TEMP/real-sessions"
      - uses: actions/upload-artifact@v7
        with:
          name: real-sessions
          path: ${{ runner.temp }}/real-sessions/
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.edition }} (${{ matrix.zone }})
    needs: real-sessions
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        edition: ["5.1", "7"]
        zone: ["Pacific Standard Time", "Tokyo Standard Time"]
        include:
          - zone: "Pacific Standard Time"
            offset: -8
          - zone: "Tokyo Standard Time"
            offset: 9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: real-sessions
          path: ${{ runner.temp }}/real-sessions
      - name: Set the time zone
        shell: pwsh
        run: |
          tzutil /s "${{ matrix.zone }}"
          tzutil /g
      - name: Validate under Windows PowerShell 5.1
        if: matrix.edition == '5.1'
        shell: powershell
        run: |
          & .\tests\research-history\Test-ResearchHistory.ps1 -Analyzer .\tests\research-history\research-history.ps1 `
            -UtcOffsetHours ${{ matrix.offset }} -ExpectMajor 5 -Report "$env:RUNNER_TEMP\report" -RealDir "$env:RUNNER_TEMP\real-sessions"
          exit $LASTEXITCODE
      - name: Validate under PowerShell 7
        if: matrix.edition == '7'
        shell: pwsh
        run: |
          & .\tests\research-history\Test-ResearchHistory.ps1 -Analyzer .\tests\research-history\research-history.ps1 `
            -UtcOffsetHours ${{ matrix.offset }} -ExpectMajor 7 -Report "$env:RUNNER_TEMP\report" -RealDir "$env:RUNNER_TEMP\real-sessions"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-ps${{ matrix.edition }}-${{ matrix.offset }}
          path: ${{ runner.temp }}/report/

  package:
    name: validated script for download
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Copy the validated script with its SHA-256
        run: |
          mkdir -p "$RUNNER_TEMP/script"
          cp tests/research-history/research-history.ps1 "$RUNNER_TEMP/script/"
          cd "$RUNNER_TEMP/script"
          sha256sum research-history.ps1 | tee research-history.ps1.sha256 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: research-history-script
          path: ${{ runner.temp }}/script/
