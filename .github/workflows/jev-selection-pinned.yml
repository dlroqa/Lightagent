name: jev specialist selection (pinned PR commit)

# Jev's specialist selection for a reviewed, pinned pull-request commit,
# before it is merged, without exposing the Jev key to that commit's code.
#
#   prepare  no secret     builds the pinned commit and exports the exact
#                          request bodies it would send (artifact).
#   send     jev-live      runs NO repository code: it validates those
#                          bodies with jq and sends them with curl, one at a
#                          time, then records the responses (artifact). The
#                          environment's reviewer approves this job and can
#                          read the exported requests first; the digest the
#                          prepare job published must match what is sent.
#                          One pass at most: 24 requests, no retries. A
#                          second pass is a new dispatch and a new approval.
#   score    no secret     builds the pinned commit again and scores the
#                          recorded responses with its own rules.
#
# The workflow definition always comes from master (a manual dispatch runs
# the default branch's file), so a pull request cannot change these steps.
# The pinned commit must be the current head of an open pull request from a
# branch of this repository. On pull requests only `prepare` runs, with no
# secret, to keep the export path tested; a commit without the export
# harness (master before the stack merges) has nothing to export.

on:
  pull_request:
    paths:
      - .github/workflows/jev-selection-pinned.yml
      - crates/lightagent/src/coordinator/**
      - evaluation/subagents/selection.v1.json
  workflow_dispatch:
    inputs:
      sha:
        description: The reviewed pull-request head commit to evaluate (40 hex characters)
        required: true
      max_requests:
        description: Maximum Jev requests (1-24; one pass over the 24 prompts)
        required: true
        default: '24'

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'jev-live' || format('jev-selection-pinned-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'

jobs:
  prepare:
    name: Export the pinned commit's requests (no secret)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      digest: ${{ steps.digest.outputs.digest }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Pin the commit
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != workflow_dispatch ]; then
            echo "sha=$PR_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF" != refs/heads/master ]; then
            echo "Dispatch from master only: the workflow definition must be the reviewed one."; exit 1
          fi
          if ! [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sha must be a full 40-character commit id"; exit 1
          fi
          # The current head of an open pull request from this repository.
          open=$(gh api "repos/$GITHUB_REPOSITORY/commits/$INPUT_SHA/pulls" \
            --jq "[.[] | select(.state == \"open\" and .head.sha == \"$INPUT_SHA\" and .head.repo.full_name == \"$GITHUB_REPOSITORY\") | .number] | join(\",\")")
          if [ -z "$open" ]; then
            echo "$INPUT_SHA is not the head of an open pull request from this repository"; exit 1
          fi
          echo "Pinned $INPUT_SHA, head of pull request(s) $open." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "sha=$INPUT_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pin.outputs.sha }}
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: jev-pinned
      - name: Find the export harness
        id: harness
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if grep -q 'fn export_selection_requests' crates/lightagent/src/coordinator/evaluation/specialists.rs 2>/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = workflow_dispatch ]; then
            echo "The pinned commit has no selection export harness."; exit 1
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "This commit has no selection export harness: nothing to export." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Export the requests
        if: steps.harness.outputs.present == 'true'
        env:
          LIGHTAGENT_SELECTION_EXPORT: ${{ runner.temp }}/selection-requests
          LIGHTAGENT_JEV_LIVE_COMMIT: ${{ steps.pin.outputs.sha }}
        run: >-
          cargo test -p lightagent --lib --
          --ignored --exact --nocapture coordinator::evaluation::specialists::export_selection_requests
      - name: Record the requests' digest
        id: digest
        if: steps.harness.outputs.present == 'true'
        working-directory: ${{ runner.temp }}/selection-requests
        run: |
          set -euo pipefail
          digest=$(sha256sum sel-*.json | sha256sum | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Exported requests"
            echo "Pinned commit: \`${{ steps.pin.outputs.sha }}\`. Digest of the request set: \`$digest\`."
            echo '```'
            sha256sum sel-*.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: steps.harness.outputs.present == 'true'
        with:
          name: selection-requests
          path: ${{ runner.temp }}/selection-requests/
          if-no-files-found: error
          retention-days: 7

  send:
    name: Send the reviewed requests (jev-live, runs no repository code)
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && github.repository == 'dlroqa/Lightagent'
    runs-on: ubuntu-24.04
    environment: jev-live
    timeout-minutes: 15
    permissions: {}
    outputs:
      status: ${{ steps.send.outputs.status }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: selection-requests
          path: requests
      - name: Validate and send
        id: send
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
          EXPECTED_DIGEST: ${{ needs.prepare.outputs.digest }}
          URL: https://api.typesafe.ai/v1/systemone
        run: |
          set -euo pipefail
          mkdir -p responses
          if [ -z "${TYPESAFE_API_KEY:-}" ]; then
            printf '{"evaluation":"jev_specialist_selection","status":"BLOCKED","evaluated":false,"reason":"TYPESAFE_API_KEY is not configured in the jev-live environment"}\n' > responses/status.json
            echo "status=BLOCKED" >> "$GITHUB_OUTPUT"
            echo "::notice title=Jev specialist selection BLOCKED::NOT EVALUATED: no credential."
            echo "## Jev specialist selection: BLOCKED — NOT EVALUATED (no credential)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$MAX_REQUESTS" in ''|*[!0-9]*) echo "max_requests must be a whole number"; exit 1 ;; esac
          if [ "$MAX_REQUESTS" -lt 1 ] || [ "$MAX_REQUESTS" -gt 24 ]; then echo "max_requests must be 1-24"; exit 1; fi
          # Only sel-NNN request bodies (plus prepare's manifest, which is
          # never sent), at most 24, unchanged since prepare published
          # their digest.
          [ -z "$(find requests -mindepth 1 ! -name 'sel-[0-9][0-9][0-9].json' ! -name manifest.json)" ] || { echo "unexpected files in the request set"; exit 1; }
          [ "$(find requests -name 'sel-*.json' | wc -l)" -le 24 ] || { echo "more than 24 requests"; exit 1; }
          digest=$(cd requests && sha256sum sel-*.json | sha256sum | cut -d' ' -f1)
          [ -n "$EXPECTED_DIGEST" ] && [ "$digest" = "$EXPECTED_DIGEST" ] || { echo "the request set does not match the digest prepare published"; exit 1; }
          echo "Request set digest $digest matches prepare." >> "$GITHUB_STEP_SUMMARY"
          sent=0; failed=0; stopped=no
          for file in requests/sel-*.json; do
            if [ "$sent" -ge "$MAX_REQUESTS" ]; then stopped=request_ceiling; break; fi
            id=$(basename "$file" .json)
            [[ "$id" =~ ^sel-[0-9]{3}$ ]] || { echo "unexpected file $file"; exit 1; }
            [ "$(stat -c %s "$file")" -le 16384 ] || { echo "$id is over 16 KiB"; exit 1; }
            # Only a typed request: a model, a string state, at most 11
            # choice/noul/score questions, nothing else.
            jq -e '(keys == ["model","questions","state"])
                   and (.model | type == "string" and length < 64)
                   and (.state | type == "string" and length <= 2000)
                   and (.questions | type == "object" and length <= 11)
                   and ([.questions[].type] | all(. == "choice" or . == "noul" or . == "score"))' \
              "$file" > /dev/null || { echo "$id is not a typed selection request"; exit 1; }
            code=$(curl -sS --proto '=https' --max-redirs 0 --max-time 10 --max-filesize 65536 \
              -o "responses/$id.json" -w '%{http_code}' \
              -H "Authorization: Bearer $TYPESAFE_API_KEY" -H 'content-type: application/json' \
              --data-binary @"$file" "$URL" || echo 000)
            sent=$((sent + 1))
            # Keep a response only if it is a JSON object that does not
            # echo the credential.
            if [ "$code" = 200 ] && { ! jq -e 'type == "object"' "responses/$id.json" > /dev/null 2>&1 \
                || grep -qF -- "$TYPESAFE_API_KEY" "responses/$id.json"; }; then
              code=invalid
            fi
            case "$code" in
              200) failed=0 ;;
              401|403) rm -f "responses/$id.json"; stopped=credential; break ;;
              *) rm -f "responses/$id.json"; failed=$((failed + 1))
                 if [ "$failed" -ge 3 ]; then stopped=endpoint_failures; break; fi ;;
            esac
          done
          printf '{"sent":%s,"ceiling":%s,"retries":0,"stopped":"%s"}\n' "$sent" "$MAX_REQUESTS" "$stopped" > responses/send.json
          echo "status=SENT" >> "$GITHUB_OUTPUT"
          echo "Sent $sent request(s) of at most $MAX_REQUESTS; stopped: $stopped." >> "$GITHUB_STEP_SUMMARY"
          [ "$stopped" != credential ] && [ "$stopped" != endpoint_failures ]
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: selection-responses
          path: responses/
          if-no-files-found: error
          retention-days: 7

  score:
    name: Score the recorded responses (no secret)
    needs: [prepare, send]
    if: github.event_name == 'workflow_dispatch' && needs.send.outputs.status == 'SENT'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: jev-pinned
      - uses: actions/download-artifact@v8
        with:
          name: selection-requests
          path: ${{ runner.temp }}/selection-requests
      - uses: actions/download-artifact@v8
        with:
          name: selection-responses
          path: ${{ runner.temp }}/selection-responses
      - name: Score with the pinned commit's rules
        env:
          LIGHTAGENT_SELECTION_EXPORT: ${{ runner.temp }}/selection-requests
          LIGHTAGENT_SELECTION_RESPONSES: ${{ runner.temp }}/selection-responses
          LIGHTAGENT_SELECTION_LIVE_MAX_REQUESTS: ${{ inputs.max_requests }}
          LIGHTAGENT_JEV_LIVE_COMMIT: ${{ needs.prepare.outputs.sha }}
          LIGHTAGENT_JEV_EVAL_OUT: ${{ runner.temp }}/jev-selection
        run: >-
          cargo test -p lightagent --lib replay_specialist_selection_evaluation
          -- --ignored --nocapture --test-threads=1
      - name: Summarize
        if: always()
        env:
          LIGHTAGENT_JEV_EVAL_OUT: ${{ runner.temp }}/jev-selection
        run: |
          for summary in "$LIGHTAGENT_JEV_EVAL_OUT"/*.md; do
            [ -f "$summary" ] && { cat "$summary"; echo; } >> "$GITHUB_STEP_SUMMARY"
          done
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jev-selection-reports
          path: ${{ runner.temp }}/jev-selection/
          if-no-files-found: warn
