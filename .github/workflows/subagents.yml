name: subagents

# Specialist-subagent evidence. The seeded job runs the regression tests that
# are still ignored with a `seeded:` reason (one per open baseline gap) and
# reports which of them pass; it is a report, not a gate, because a seeded
# test fails by design until its stage closes the gap. Closed gaps lose their
# `ignore` and run in the required `check` workflow like any other test.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: subagents-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'

jobs:
  seeded:
    name: Seeded subagent gaps (report)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: subagents
      - name: Run the seeded tests
        run: |
          # Actions runs bash with -e; a seeded failure must not end the step.
          set +e -uo pipefail
          out="$RUNNER_TEMP/seeded.log"
          : > "$out"
          cargo test -p lightagent-tools --test subagent_baseline -- --ignored 2>&1 | tee -a "$out"
          cargo test -p lightagent --lib seeded_ -- --ignored 2>&1 | tee -a "$out"
          {
            echo "### Seeded subagent gaps at \`${GITHUB_SHA}\`"
            echo
            echo "A seeded test fails while its gap is open. \`ok\` means the gap is closed and its \`ignore\` can be removed."
            echo
            echo '| Test | Result |'
            echo '| --- | --- |'
            grep -E '^test .*seeded_.* \.\.\. ' "$out" \
              | sed -E 's/^test (.*) \.\.\. (.*)$/| `\1` | \2 |/'
          } >> "$GITHUB_STEP_SUMMARY"
          # Compilation failures must not hide behind the report.
          grep -Eq '^test result:' "$out"

  broker-live:
    name: Tester broker (live GitHub Actions)
    # Same-repository pull requests and manual runs only: a fork's code never
    # receives this job's token. The token can dispatch, read and cancel
    # workflow runs here and read contents, nothing else, and ends with the job.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # contents: write only so the live coder check can create, commit to and
    # delete its own scratch branch (subagents/live-coder-*).
    permissions:
      actions: write
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: subagents
      - name: Dispatch and read the fixture workflow through the broker
        env:
          LIGHTAGENT_BROKER_LIVE_TOKEN: ${{ github.token }}
          LIGHTAGENT_BROKER_LIVE_REPOSITORY: ${{ github.repository }}
          LIGHTAGENT_BROKER_LIVE_REF: ${{ github.head_ref || github.ref_name }}
          LIGHTAGENT_BROKER_LIVE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          cargo test -p lightagent-tools --test actions_broker -- --ignored --nocapture --test-threads=1 live_ \
            2>&1 | tee "$RUNNER_TEMP/broker.log"
      - name: Summarize
        if: always()
        run: |
          {
            echo "### Tester broker, live"
            echo
            echo '```'
            grep -E '^(EVIDENCE|BLOCKED)' "$RUNNER_TEMP/broker.log" || echo "no evidence lines"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  role-eval-live:
    name: Role evaluation (live models, BLOCKED without an endpoint)
    # The recorded set in evaluation/subagents/roles.v1.json, run by real
    # models through the real worker runtime against local fixtures. It
    # needs an operator-approved endpoint: secret SUBAGENT_EVAL_BASE_URL,
    # optional secret SUBAGENT_EVAL_API_KEY, variable SUBAGENT_EVAL_MODELS
    # (comma-separated). It reads them only on a manual dispatch; pull
    # requests and a missing endpoint record BLOCKED, never a pass.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: subagents
      - name: Report that live evaluation does not run here
        if: github.event_name != 'workflow_dispatch'
        run: |
          {
            echo "### Role evaluation (live): BLOCKED"
            echo
            echo "Live models run only on a manual dispatch with an operator-approved"
            echo "endpoint (docs/subagents/live-evaluation-proposal.md); pull requests never"
            echo "read its secrets. Nothing was evaluated; this is not a pass."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run the recorded role evaluation
        if: github.event_name == 'workflow_dispatch'
        env:
          LIGHTAGENT_EVAL_BASE_URL: ${{ secrets.SUBAGENT_EVAL_BASE_URL }}
          LIGHTAGENT_EVAL_API_KEY: ${{ secrets.SUBAGENT_EVAL_API_KEY }}
          LIGHTAGENT_EVAL_MODEL: ${{ vars.SUBAGENT_EVAL_MODELS }}
          LIGHTAGENT_EVAL_OUT: ${{ runner.temp }}/role-eval
        run: |
          if [ -z "$LIGHTAGENT_EVAL_BASE_URL" ] || [ -z "$LIGHTAGENT_EVAL_MODEL" ]; then
            {
              echo "### Role evaluation (live): BLOCKED"
              echo
              echo "No operator-approved model endpoint is configured. Nothing was evaluated;"
              echo "this is not a pass."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set -o pipefail
          cargo test -p lightagent --test role_eval -- --ignored --nocapture live_ \
            2>&1 | tee "$RUNNER_TEMP/role-eval.log"
      - name: Summarize
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/role-eval.log" ] || exit 0
          {
            echo "### Role evaluation (live)"
            echo '```'
            grep -E '^(EVIDENCE|BLOCKED)' "$RUNNER_TEMP/role-eval.log" || echo "no evidence lines"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: role-eval
          path: ${{ runner.temp }}/role-eval/
          if-no-files-found: ignore
          retention-days: 7
