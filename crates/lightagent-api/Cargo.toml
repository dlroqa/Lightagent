[package]
name = "lightagent-api"
description = "The Lightagent HTTP API: runs, sessions, tools and approvals over axum with SSE streaming."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# The provisioning HTTP contract (`provisioning::routes`). Off by default and
# enabled by no release or production build: CI builds and tests it on its
# own. Even when compiled, `router()` never serves it.
provisioning-api = []

[dependencies]
lightagent-core.workspace = true
lightagent-tools.workspace = true
lightagent-store.workspace = true
async-trait.workspace = true
axum = { workspace = true }
tokio = { workspace = true }
tokio-util.workspace = true
serde = { workspace = true }
serde_json.workspace = true
futures-util.workspace = true

[dev-dependencies]
async-trait.workspace = true
