[package]
name = "lightagent-desktop"
description = "The Lightagent desktop host: owns the window and the bundled runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Unattended switch scenarios for hosted end-to-end tests only; the bundled
# app is never built with it (see .github/workflows/desktop.yml).
e2e-hooks = []

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Plain HTTP to the owned loopback runtime only; no TLS stack in D2.
reqwest = { version = "0.13.4", default-features = false, features = ["stream"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", features = ["sync", "time"] }
getrandom = "0.4.3"
base64 = "0.22.1"
