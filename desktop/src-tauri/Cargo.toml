[package]
name = "lightagent-desktop"
description = "The Lightagent desktop host: owns the window and the bundled runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Unattended switch scenarios for hosted end-to-end tests only; the bundled
# app is never built with it (see .github/workflows/desktop.yml).
e2e-hooks = []

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The owned loopback runtime over plain HTTP, and in remote mode (D8) the
# server the person names over HTTPS. TLS as the runtime has it: rustls with
# the ring provider, installed by the host (no cmake, no OpenSSL).
reqwest = { version = "0.13.4", default-features = false, features = ["stream", "rustls-no-provider"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", features = ["sync", "time"] }
getrandom = "0.4.3"
base64 = "0.22.1"

# The native file picker for host-side secret input (src/secret.rs). Each is
# already in the tree through tauri; these name the APIs the host calls.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
